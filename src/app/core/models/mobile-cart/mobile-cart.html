<div
  *ngIf="isOpen"
  class="fixed inset-0 z-[90] flex items-end justify-center p-2 bg-black/45 backdrop-blur-sm md:items-center"
  (click)="close()"
>
  <div
    class="w-full max-w-md overflow-hidden bg-white rounded-3xl shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="px-4 py-4 border-b border-gray-100">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="flex items-center justify-center w-6 h-6 text-xs text-white bg-green-600 rounded-full">
            ✓
          </span>
          <p class="text-2xl font-semibold text-gray-900">Added to cart</p>
        </div>
        <button
          (click)="close()"
          class="p-1.5 text-gray-500 transition rounded-full hover:bg-gray-100 hover:text-gray-700"
          aria-label="Close"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div *ngIf="item as data" class="p-4 space-y-4">
      <div class="flex gap-3">
        <img [src]="data.image" [alt]="data.name" class="object-cover w-16 h-16 border border-gray-200 rounded-lg" />
        <div class="min-w-0">
          <span class="inline-flex px-2 py-0.5 text-[10px] font-semibold text-green-700 bg-green-50 border border-green-200 rounded-full">
            IN {{ data.quantity }} CART{{ data.quantity > 1 ? 'S' : '' }}
          </span>
          <p class="mt-1 text-sm font-medium leading-snug text-gray-900 line-clamp-2">{{ data.name }}</p>
        </div>
      </div>

      <div class="space-y-1 text-sm">
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Item</span>
          <span class="font-semibold text-gray-900">${{ (data.price * data.quantity).toFixed(2) }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Shipping</span>
          <span class="font-semibold text-gray-900">${{ data.shipping.toFixed(2) }}</span>
        </div>
        <div class="flex items-center justify-between pt-1">
          <span class="font-semibold text-gray-900">Subtotal</span>
          <span class="text-lg font-bold text-gray-900">${{ subtotal.toFixed(2) }}</span>
        </div>
      </div>

      <button
        (click)="onSeeCart()"
        class="w-full py-3 text-base font-semibold text-white transition bg-green-600 rounded-full hover:bg-green-700"
      >
        See in cart
      </button>
    </div>
  </div>
</div>
