<!-- Grid card (categories / home desktop / shop) -->
<article
  *ngIf="layout === 'grid'"
  class="overflow-hidden bg-white border border-gray-200 rounded-xl"
  aria-hidden="true"
>
  <div class="product-card-skeleton-image aspect-square">
    <img src="/loader-image.png" alt="" class="object-contain w-full h-full" />
  </div>
  <div class="p-3 space-y-2 md:p-4">
    <div class="h-3 w-full rounded skeleton-pulse"></div>
    <div class="h-3 w-2/3 rounded skeleton-pulse"></div>
    <div class="h-4 w-1/3 rounded skeleton-pulse"></div>
  </div>
</article>

<!-- Compact card (home mobile strip / mobile grids) -->
<article
  *ngIf="layout === 'compact'"
  class="w-full overflow-hidden bg-white border border-gray-200 rounded-lg"
  aria-hidden="true"
>
  <div class="product-card-skeleton-image aspect-[4/3] md:aspect-square">
    <img src="/loader-image.png" alt="" class="object-contain w-full h-full" />
  </div>
  <div class="p-2 space-y-2">
    <div class="h-3 w-full rounded skeleton-pulse"></div>
    <div class="h-3 w-2/3 rounded skeleton-pulse"></div>
    <div class="h-4 w-1/2 rounded skeleton-pulse"></div>
  </div>
</article>

<!-- List row (product-list / search-result desktop) -->
<article
  *ngIf="layout === 'list'"
  class="flex flex-col gap-4 p-4 bg-white border border-gray-200 rounded-lg sm:flex-row"
  aria-hidden="true"
>
  <div class="flex-shrink-0 w-full h-48 mx-auto sm:w-48 sm:mx-0">
    <div class="product-card-skeleton-image w-full h-full rounded-lg overflow-hidden">
      <img src="/loader-image.png" alt="" class="object-contain w-full h-full" />
    </div>
  </div>
  <div class="flex-1 min-w-0 space-y-3">
    <div class="rounded h-5 w-5/6 skeleton-pulse"></div>
    <div class="rounded h-5 w-3/4 skeleton-pulse"></div>
    <div class="w-20 h-4 rounded skeleton-pulse"></div>
    <div class="w-24 h-8 rounded skeleton-pulse"></div>
    <div class="w-32 h-4 rounded skeleton-pulse"></div>
    <div class="w-full h-4 rounded skeleton-pulse"></div>
    <div class="w-28 h-10 rounded-lg skeleton-pulse"></div>
  </div>
</article>
