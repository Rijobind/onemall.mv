<div
  *ngIf="isOpen"
  class="confirm-dialog-root"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'confirm-dialog-title'"
>
  <div class="confirm-dialog-backdrop" (click)="onBackdropClick()"></div>

  <div class="confirm-dialog-panel">
    <div class="confirm-dialog-icon" [class.danger]="confirmVariant === 'danger'" aria-hidden="true">
      <svg *ngIf="confirmVariant === 'danger'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
        />
      </svg>
      <svg *ngIf="confirmVariant === 'primary'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
          d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    </div>

    <h2 id="confirm-dialog-title" class="confirm-dialog-title">{{ title }}</h2>
    <p class="confirm-dialog-message">{{ message }}</p>

    <div class="confirm-dialog-actions">
      <button type="button" class="confirm-dialog-btn cancel" (click)="cancel()">
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="confirm-dialog-btn confirm"
        [class.danger]="confirmVariant === 'danger'"
        [class.primary]="confirmVariant === 'primary'"
        (click)="confirm()"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
